<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Box Distribution Analysis</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      margin-bottom: 10px;
    }

    .top-bar {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      font-size: 14px;
    }

    .top-bar button {
      padding: 6px 12px;
      border: none;
      border-radius: 4px;
      background: #0078d4;
      color: #fff;
      cursor: pointer;
      font-size: 13px;
    }

    .top-bar button:hover {
      background: #005fa3;
    }

    #updated {
      margin-left: auto;
      font-size: 13px;
      color: #444;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #ffffff;
      border-radius: 6px;
      overflow: hidden;
    }

    th, td {
      padding: 8px;
      border-bottom: 1px solid #e0e0e0;
      text-align: left;
      font-size: 13px;
    }

    th {
      background: #f0f0f0;
      font-weight: 600;
    }

    tr:nth-child(even) {
      background: #fafafa;
    }

    tbody tr:nth-child(1),
    tbody tr:nth-child(2),
    tbody tr:nth-child(3) {
      background: #fff7d6;
    }

    .empty-msg {
      margin-top: 10px;
      font-size: 13px;
      color: #666;
    }
  </style>
</head>
<body>

  <h1>Box Distribution Analysis</h1>

  <div class="top-bar">
    <button onclick="renderAnalyze()">Refresh</button>
    <button onclick="resetAnalysis()">Reset</button>
    <span id="updated"></span>
  </div>

  <table>
    <thead>
      <tr>
        <th>Emp No</th>
        <th>Name</th>
        <th>Total Qty</th>
        <th>Last Assign</th>
        <th>Waiting</th>
      </tr>
    </thead>
    <tbody id="analyzeBody"></tbody>
  </table>

  <div id="emptyMessage" class="empty-msg"></div>

  <script>
    function loadEmployees() {
      try {
        const raw = localStorage.getItem("employees");
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : [];
      } catch {
        return [];
      }
    }

    function parseTodayTime(timeStr) {
      if (!timeStr) return null;
      const today = new Date();
      const d = new Date(today.toDateString() + " " + timeStr);
      return isNaN(d.getTime()) ? null : d;
    }

    function formatHHMM(minutes) {
      const h = Math.floor(minutes / 60);
      const m = minutes % 60;
      return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")} hrs`;
    }

    function getWaitingMinutes(emp) {
      if (!emp.boxes || emp.boxes.length === 0) return 9999;

      const last = emp.boxes[emp.boxes.length - 1];
      const lastDate = parseTodayTime(last.time);
      if (!lastDate) return 0;

      const diffMs = Date.now() - lastDate.getTime();
      const diffMin = Math.floor(diffMs / 60000);
      return diffMin < 0 ? 0 : diffMin;
    }

    function buildAnalyzeData() {
      const employees = loadEmployees();

      const list = employees.map(emp => {
        const boxes = Array.isArray(emp.boxes) ? emp.boxes : [];
        const totalQty = boxes.reduce((s, b) => s + (b.qty || 0), 0);
        const waiting = getWaitingMinutes(emp);
        const lastTime = boxes.length ? boxes[boxes.length - 1].time : "-";

        return {
          no: emp.no || "",
          name: emp.name || "",
          totalQty,
          waiting,
          lastTime
        };
      });

      list.sort((a, b) => {
        if (a.totalQty !== b.totalQty) return a.totalQty - b.totalQty;
        return b.waiting - a.waiting;
      });

      return list;
    }

    function renderAnalyze() {
      const tbody = document.getElementById("analyzeBody");
      const emptyMsg = document.getElementById("emptyMessage");
      tbody.innerHTML = "";
      emptyMsg.textContent = "";

      const data = buildAnalyzeData();

      if (!data.length) {
        emptyMsg.textContent = "No employees found in localStorage.";
      }

      data.forEach(row => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${row.no}</td>
          <td>${row.name}</td>
          <td>${row.totalQty}</td>
          <td>${row.lastTime}</td>
          <td>${formatHHMM(row.waiting)}</td>
        `;
        tbody.appendChild(tr);
      });

      const now = new Date();
      document.getElementById("updated").textContent =
        "Updated at " +
        now.getHours().toString().padStart(2, "0") + ":" +
        now.getMinutes().toString().padStart(2, "0");
    }

    function resetAnalysis() {
      const employees = loadEmployees();
      employees.forEach(emp => emp.boxes = []);
      localStorage.setItem("employees", JSON.stringify(employees));
      renderAnalyze();
      alert("All box data reset successfully.");
    }

    renderAnalyze();
  </script>

</body>
</html>
