<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Production Analysis</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    padding: 20px;
  }

  h2 {
    margin-bottom: 10px;
  }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    font-size: 14px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: #fff;
    table-layout: fixed; /* 🔹 KEY for alignment */
  }

  th, td {
    padding: 8px 6px;
    border-bottom: 1px solid #ddd;
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  th {
    background: #f0f0f0;
    font-weight: 600;
  }

  /* 🔹 Column widths + alignment */
  th:nth-child(1), td:nth-child(1) { width: 10%; text-align: center; }
  th:nth-child(2), td:nth-child(2) { width: 25%; text-align: left; }
  th:nth-child(3), td:nth-child(3) { width: 12%; text-align: center; }
  th:nth-child(4), td:nth-child(4) { width: 12%; text-align: center; }
  th:nth-child(5), td:nth-child(5) { width: 18%; text-align: center; }
  th:nth-child(6), td:nth-child(6) { width: 23%; text-align: center; }

  tr:nth-child(even) {
    background: #fafafa;
  }

  .empty-msg {
    margin-top: 10px;
    font-size: 13px;
    color: #666;
  }

  button {
    padding: 5px 10px;
    font-size: 13px;
    cursor: pointer;
  }
</style>

</head>

<body>

<h2>Production Analysis</h2>

<div class="top-bar">
  <button onclick="renderAnalyze()">Refresh</button>
  <span id="updated"></span>
</div>

<table>
  <thead>
    <tr>
      <th>Emp No</th>
      <th>Name</th>
      <th>Total Qty</th>
      <th>Box Count</th>
      <th>Avg Time / Box (HH:MM)</th>
      <th>Last Assign</th>
    </tr>
  </thead>
  <tbody id="analyzeBody"></tbody>
</table>

<div id="emptyMessage" class="empty-msg"></div>

<script>
function loadEmployees() {
  try {
    const raw = localStorage.getItem("employees");
    if (!raw) return [];
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : [];
  } catch {
    return [];
  }
}

function parseTodayTime(timeStr) {
  if (!timeStr) return null;
  const today = new Date();
  const d = new Date(today.toDateString() + " " + timeStr);
  return isNaN(d.getTime()) ? null : d;
}

function formatHHMM(min) {
  const h = Math.floor(min / 60);
  const m = min % 60;
  return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`;
}

// Calculate average production time per box
function calcAvgProductionTime(boxes) {
  if (!boxes || boxes.length < 2) return 0;

  let totalMin = 0;
  let count = 0;

  for (let i = 1; i < boxes.length; i++) {
    const prev = parseTodayTime(boxes[i - 1].time);
    const curr = parseTodayTime(boxes[i].time);

    if (!prev || !curr) continue;

    const diffMin = Math.floor((curr - prev) / 60000);
    if (diffMin > 0) {
      totalMin += diffMin;
      count++;
    }
  }

  return count ? Math.round(totalMin / count) : 0;
}

function buildAnalyzeData() {
  const employees = loadEmployees();

  return employees.map(emp => {
    const boxes = Array.isArray(emp.boxes) ? emp.boxes : [];
    return {
      no: emp.no || "",
      name: emp.name || "",
      totalQty: boxes.reduce((s,b)=>s+(b.qty||0),0),
      boxCount: boxes.length,
      avgTime: calcAvgProductionTime(boxes),
      lastTime: boxes.length ? boxes[boxes.length - 1].time : "-"
    };
  });
}

function renderAnalyze() {
  const tbody = document.getElementById("analyzeBody");
  const emptyMsg = document.getElementById("emptyMessage");
  const updated = document.getElementById("updated");

  tbody.innerHTML = "";
  emptyMsg.textContent = "";

  const data = buildAnalyzeData();

  if (!data.length) {
    emptyMsg.textContent = "No employees found in localStorage.";
    return;
  }

  data.forEach(r => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${r.no}</td>
      <td>${r.name}</td>
      <td>${r.totalQty}</td>
      <td>${r.boxCount}</td>
      <td>${formatHHMM(r.avgTime)}</td>
      <td>${r.lastTime}</td>
    `;
    tbody.appendChild(tr);
  });

  const now = new Date();
  updated.textContent =
    "Updated at " +
    now.getHours().toString().padStart(2,"0") + ":" +
    now.getMinutes().toString().padStart(2,"0");
}

renderAnalyze();
</script>

</body>
</html>
